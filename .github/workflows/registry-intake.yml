# Turns an "Add project" issue into a validated registry PR.
# Requires: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Registry intake

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  intake:
    if: startsWith(github.event.issue.title, 'Add project:') || startsWith(github.event.issue.title, 'Nominate project:') || contains(github.event.issue.labels.*.name, 'add-project')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      # Untrusted input: only ever passed through env and files, never interpolated into scripts.
      ISSUE_BODY: ${{ github.event.issue.body }}
      INTAKE_URL: ${{ github.event.issue.html_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create registry entry
        id: entry
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/body.md"
          if ! python3 plugins/discover/cli/discover.py registry-add --body-file "$RUNNER_TEMP/body.md" --intake "$INTAKE_URL" --out registry/projects > "$RUNNER_TEMP/entry.json" 2> "$RUNNER_TEMP/err.txt"; then
            { echo "Couldn't create a registry entry:"; echo; echo '```'; cat "$RUNNER_TEMP/err.txt"; echo '```'; } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
            exit 1
          fi
          gh issue edit "$ISSUE" --add-label add-project >/dev/null 2>&1 || true
          for k in slug repo nominated mode branch; do echo "$k=$(jq -r .$k "$RUNNER_TEMP/entry.json")" >> "$GITHUB_OUTPUT"; done
      # One entry and one open registry PR per repository. A second request is linked, not re-pushed.
      - name: Check for an existing entry or registry PR
        id: dup
        env:
          SLUG: ${{ steps.entry.outputs.slug }}
          REPO: ${{ steps.entry.outputs.repo }}
          MODE: ${{ steps.entry.outputs.mode }}
          BRANCH: ${{ steps.entry.outputs.branch }}
        run: |
          if [ "$MODE" = duplicate ]; then
            echo "\`$REPO\` is already in the registry as \`$SLUG\`, so there's nothing to add. If something about it should change (a proposal link, the maintainers' consent), a hub maintainer will update the entry from this issue." > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
            echo "stop=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pr=$(gh pr list --head "$BRANCH" --state open --json number,body -q '.[0].number // empty')
          if [ -n "$pr" ] && ! gh pr view "$pr" --json body -q .body | grep -q "closes #$ISSUE)"; then
            gh pr comment "$pr" --body "Also requested in #$ISSUE. Check it before merging: a maintainer's application there records consent, and a nomination may add a proposal link." >/dev/null
            echo "Thanks! \`$REPO\` already has a registry PR waiting for review: #$pr. I've linked this issue there, so a hub maintainer will take it into account." > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
            echo "stop=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "stop=false" >> "$GITHUB_OUTPUT"
      - name: Check the repository is public
        if: steps.dup.outputs.stop != 'true'
        env:
          REPO: ${{ steps.entry.outputs.repo }}
        run: |
          vis=$(gh repo view "$REPO" --json visibility -q .visibility 2>/dev/null || echo MISSING)
          if [ "$vis" != "PUBLIC" ]; then
            echo "This hub lists public GitHub repositories, and \`$REPO\` isn't one it can read (visibility: $vis). Check the name and edit this issue to re-run." > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
            exit 1
          fi
      - name: Validate repository
        id: validate
        if: steps.dup.outputs.stop != 'true'
        env:
          SLUG: ${{ steps.entry.outputs.slug }}
        run: |
          set +e
          python3 plugins/discover/cli/discover.py validate --registry-entry "registry/projects/$SLUG.json" > "$RUNNER_TEMP/report.txt" 2>&1
          echo "ok=$([ $? -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.txt"
      # Projects are met where they are (spec §3.4): a repo that doesn't validate yet still gets a
      # registry PR, labelled needs-adapter, and the hub writes its adapter before merging.
      - name: Open registry PR
        if: steps.dup.outputs.stop != 'true'
        env:
          SLUG: ${{ steps.entry.outputs.slug }}
          MODE: ${{ steps.entry.outputs.mode }}
          BRANCH: ${{ steps.entry.outputs.branch }}
          REPO: ${{ steps.entry.outputs.repo }}
          OK: ${{ steps.validate.outputs.ok }}
          NOMINATED: ${{ steps.entry.outputs.nominated }}
        run: |
          branch="$BRANCH"
          git config user.name "discover-registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "registry/projects/$SLUG.json"
          if [ "$MODE" = consent ]; then verb="Record consent for"; elif [ "$NOMINATED" = true ]; then verb="Nominate"; else verb="Add"; fi
          title="$verb $REPO"
          git commit -m "$title"
          git push --force -u origin "$branch"
          if [ "$OK" = true ]; then
            note="The repository validates as is."
            labels=""
          else
            note="The repository doesn't follow the protocol's files yet, which is fine. Before merging, a hub maintainer (or a hub-work contributor) assesses it and adds an adapter to this entry: where its entry doc, current results and coordination live."
            labels="needs-adapter"
          fi
          if [ "$MODE" = consent ]; then
            note="**Consent.** A maintainer applied for a project already in the registry (likely nominated). This records consent by application, so the project becomes a full listing once merged. $note"
          elif [ "$NOMINATED" = true ]; then
            note="**Nomination.** Catalogued without a launcher until the project's maintainers add a consent record naming this hub. Don't contact them about it (spec §11.5). Assess it as is, and, if the entry links a proposal, as it would be after setup (\`projected\`). $note"
            labels="nomination${labels:+,$labels}"
          fi
          { echo "$verb \`$REPO\` (closes #$ISSUE)."; echo; echo "$note"; echo; echo '```'; cat "$RUNNER_TEMP/report.txt"; echo '```'; } > "$RUNNER_TEMP/pr.md"
          # Only an open PR counts: a closed one for the same branch is history, not this request.
          url=$(gh pr list --head "$branch" --state open --json url -q '.[0].url // empty')
          [ -n "$url" ] || url=$(gh pr create --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr.md" ${labels:+--label "$labels"})
          if [ "$MODE" = consent ]; then
            msg="Thanks! Your project was already in the registry; this records your consent to be listed: $url. A hub maintainer will review it."
          elif [ "$NOMINATED" = true ]; then
            msg="Thanks for the nomination! Registry PR: $url. Once merged, the project is catalogued on the hub without a launcher, and the hub won't contact its maintainers. It gets a launcher only if they add a consent record to their repo."
          elif [ "$OK" = true ]; then
            msg="Thanks! Registry PR: $url. A hub maintainer will review it."
          else
            msg="Thanks! Registry PR: $url. Your repo doesn't need to change anything to be listed: the hub will map where things live in it before merging. If you'd like to make it agent-ready yourself, the onboarding prompt on the hub's Add page can help, and enabling GitHub Discussions is the single most useful step."
          fi
          { echo "$msg"; echo; echo '```'; cat "$RUNNER_TEMP/report.txt"; echo '```'; } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
