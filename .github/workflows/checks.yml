name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s tests -v

  registry:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate changed registry entries
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          for f in $(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'registry/projects/*.json'); do
            echo "::group::$f"
            python3 plugins/discover/cli/discover.py validate --registry-entry "$f" --min-level 0 || status=1
            echo "::endgroup::"
          done
          exit $status
