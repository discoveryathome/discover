name: Add or nominate a project
description: Apply to list a research repository you maintain, or nominate one you don't.
title: "Add project: OWNER/REPO"
labels: ["add-project"]
body:
  - type: markdown
    attributes:
      value: |
        A bot opens a registry PR within a minute; a hub maintainer reviews and merges it. Nothing has to change in the repository to apply.
        **Maintainers:** applying counts as consent to be listed by this hub, with a contribution launcher once the project is assessed.
        **Nominators:** a nominated project is catalogued without a launcher, so no traffic is sent to it, until its maintainers add a consent record. The hub never contacts them about a nomination.
        Easiest: paste the onboarding prompt from the hub's Add page into your agent.
  - type: input
    id: repository
    attributes:
      label: Repository
      description: GitHub URL or owner/name.
      placeholder: https://github.com/OWNER/REPO
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship to the project
      options:
        - I maintain it
        - I'm nominating it; I don't maintain it
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Your GitHub handle
      placeholder: "@you"
    validations:
      required: true
  - type: input
    id: proposal
    attributes:
      label: Proposal issue on the project
      description: Nominators only, optional. A link to the issue you opened proposing setup to the maintainers.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything reviewers should know, e.g. the credit policy if the repo doesn't state one, an evaluation summary, or safety considerations.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: What I've said about my relationship to the project is accurate
          required: true
